<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Request a security technology demonstration from Nayae."><title>Request a Demo | Nayae</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body><div id="site-header"></div><main>
<section class="page-hero page-hero-compact"><div class="container"><p class="eyebrow">REQUEST A DEMO</p><h1>Explore intelligent<br><span>security technology.</span></h1><p>Tell us what you'd like to explore and the team can follow up if a demonstration is available.</p></div></section>
<section class="section"><div class="container contact-grid"><div><h2>What would you like to see?</h2><p>Use this form to express interest in a solution.</p>
<form class="contact-form" id="demo-form" action="https://formspree.io/f/mrppblve" method="POST>
<label for="demo-name">Full name <span>*</span></label><input id="demo-name" name="name" autocomplete="name" required>
<label for="demo-email">Business email <span>*</span></label><input id="demo-email" name="email" type="email" autocomplete="email" required>
<label for="demo-company">Company name <span>*</span></label><input id="demo-company" name="company" autocomplete="organization" required>
<label for="solution-interest">Solution of interest <span>*</span></label><select id="solution-interest" name="solution" required><option value="">Choose a solution</option><option>AI video surveillance</option><option>Threat detection and analytics</option><option>Pipeline and infrastructure protection</option><option>Remote monitoring</option><option>Access control</option><option>Other / not sure</option></select>
<label for="demo-message">Message (optional)</label><textarea id="demo-message" name="message" rows="4"></textarea>
<label class="consent"><input type="checkbox" required> I agree that my information may be used to respond to this request.</label>
<button class="button button-dark" type="submit">Send Demo Request</button><p id="demo-status" class="form-status" role="status" aria-live="polite"></p>
</form></div></section>
</main><div id="site-footer"></div></body></html>
